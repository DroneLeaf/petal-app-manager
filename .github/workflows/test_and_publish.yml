name: CI/CD Pipeline

on:
  push:
    branches:
      - '*'  # Run on all branch pushes
    tags:
      - 'v*'  # Run when a version tag is pushed
  pull_request:
    branches: [ main ]  # Run on PRs targeting main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdm
        rm -f *.lock
        pdm install -G cicd
    
    - name: Run tests
      run: |
        pdm run pytest -v
        
  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install pdm build

    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
        echo "Version set to $VERSION"

    - name: Build package
      run: |
        pdm build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 7

  docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pdm
        pdm install -G cicddocs
        
    - name: Build documentation
      run: |
        cd docs
        pdm run make html 2>&1 | tee build.log
        # Exit with error code if build failed
        exit ${PIPESTATUS[0]}
        
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation-html
        path: docs/_build/html/
        retention-days: 7
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html
        force_orphan: true
  
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only run on version tags

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        repository-url: https://test.pypi.org/legacy/
        user: __token__
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip-existing: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
        repository-url: https://upload.pypi.org/legacy/
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

  build-deb:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: set_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Ensure correct version syntax
        run: |
          if [[ ! ${{ steps.set_version.outputs.VERSION }} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version number must be in the format X.Y.Z"
            exit 1
          fi

      - name: Set architecture
        id: arch
        run: |
          if [[ "${{ runner.architecture }}" == "ARM" || "${{ runner.architecture }}" == "ARM64" ]]; then
            echo "ARCH=arm64" >> $GITHUB_OUTPUT
          else
            echo "ARCH=all" >> $GITHUB_OUTPUT
          fi

      - name: Compute package name
        id: pkg
        run: |
          echo "package_name=petal-app-manager_${{ steps.set_version.outputs.VERSION }}_${{ steps.arch.outputs.ARCH }}.deb" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev rsync

      - name: Run build script
        run: |
          chmod +x build-deb.sh
          PKG_VERSION="${{ steps.set_version.outputs.VERSION }}" PKG_ARCH="${{ steps.arch.outputs.ARCH }}" ./build-deb.sh

      - name: Verify build
        run: |
          ls -la *.deb
          dpkg -I ${{ steps.pkg.outputs.package_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: petal-app-manager-deb
          path: ${{ steps.pkg.outputs.package_name }}

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.package_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-apt:
    needs: build-deb
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: petal-app-manager-deb
          path: ./

      - name: Publish to APT repository
        env:
          REPOSITORY_USERNAME: ${{ secrets.REPOSITORY_USERNAME }}
          REPOSITORY_PASSWORD: ${{ secrets.REPOSITORY_PASSWORD }}
          REPOSITORY_SERVER_IP: ${{ secrets.REPOSITORY_SERVER_IP }}
          REPOSITORY_HOSTNAME: ${{ secrets.REPOSITORY_HOSTNAME }}
        run: |
          DEB_FILE=$(ls *.deb)
          echo "Uploading: $DEB_FILE"
          curl -v -u "$REPOSITORY_USERNAME:$REPOSITORY_PASSWORD" \
            -H "Content-Type: multipart/form-data" \
            --data-binary "@$DEB_FILE" \
            http://$REPOSITORY_SERVER_IP:80/repository/apt/ \
            -H "Host: $REPOSITORY_HOSTNAME"